[workspace]
resolver = "3"
members = [
    "compiler/pw-core",
    "compiler/pw-cli",
    "compiler/pw-syntax",
    "runtime/pw-materialize",
    "runtime/pw-resource",
    "runtime/pw-resume",
    "runtime/pw-resume-wasm",
    "runtime/pw-tasks",
    "spikes/compiler-diagnostic",
    "tools/corpus-check",
    "tools/fuzz",
]
# spikes/wasmtime-component/{host,guest} are intentionally NOT workspace members:
# the guest targets wasm32-wasip2 and must not be pulled into a host-target
# `cargo test --workspace`. They are built by spikes/wasmtime-component/run.sh.
exclude = [
    "spikes/wasmtime-component/host",
    "spikes/wasmtime-component/guest",
    "spikes/wasmtime-component/guest-minimal",
]

# `runtime/pw-tasks` is E2A-R (ADR-0016). The rest of the `runtime/` tree
# arrives with the milestone that needs it: charter §12 says "Do not create
# empty directories merely to look complete".

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "local-only"
publish = false

[workspace.dependencies]
# Verified on crates.io 2026-08-05. See docs/DECISIONS/ADR-0009-parser-and-diagnostics-stack.md
# annotate-snippets is the renderer rustc itself uses; MIT OR Apache-2.0.
annotate-snippets = "0.12.16"
# ADR-0012 — lossless syntax tree. Verified on crates.io 2026-08-05.
rowan = "0.17.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Wasmtime host + guest bindings for spikes/wasmtime-component (Milestone 0 task 10).
wasmtime = "47.0.3"
wasmtime-wasi = "47.0.3"
wit-bindgen = "0.60.0"
# E6's materializer store and transactional outbox (ADR-0019). Verified on
# crates.io 2026-08-06: 0.40.1, MIT. `bundled` compiles SQLite from source, so
# the version is the crate's rather than the host's — `tools/versions.lock`
# exists to stop a measurement being a measurement of one machine's macOS.
rusqlite = { version = "0.40.1", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
