<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <title>Reality Compiler</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="world" aria-label="Compiled interactive world"></canvas>
    <div class="scanlines" aria-hidden="true"></div>

    <header>
      <div>
        <p class="eyebrow">PERFECT WEB / EXPERIMENT 01</p>
        <h1>Reality Compiler</h1>
      </div>
      <div class="runtime">
        <span id="gpu-dot" class="dot"></span>
        <span id="runtime">probing GPU</span>
      </div>
    </header>

    <aside class="telemetry" aria-live="polite">
      <span id="status">Drop an image to compile it into space.</span>
      <span id="stats"></span>
    </aside>

    <main class="console">
      <div class="prompt-row">
        <textarea id="prompt" rows="2" spellcheck="false">Turn this into a flooded lunar research station. Make depth dramatic, particles cold, and let sound disturb the world.</textarea>
        <button id="compile" class="primary">Compile</button>
      </div>
      <div class="actions">
        <label class="button">
          <input id="image" type="file" accept="image/*" hidden />
          Load image
        </label>
        <button id="mic">Enable microphone</button>
        <button class="preset" data-prompt="Turn this into a black void full of luminous dust. Make the depth extreme and movement slow.">Void</button>
        <button class="preset" data-prompt="Flood the scene. Make the world blue, reflective, deep, and reactive to bass.">Flood</button>
        <button class="preset" data-prompt="Make this feel like a hot red machine interior with violent motion and dense atmosphere.">Machine</button>
        <button id="reset">Reset camera</button>
      </div>
      <p class="hint">Drop a photo anywhere. Depth estimation runs locally. Drag to orbit, scroll to move through it.</p>
    </main>

    <div id="drop-target" aria-hidden="true">
      <strong>DROP IMAGE</strong>
      <span>local perception → depth field → GPU world</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
