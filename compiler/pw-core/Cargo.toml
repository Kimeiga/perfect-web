[package]
name = "pw-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# E1A — `pw`-owned value semantics and boundary ABI (ADR-0011).
#
# This is the first code that belongs to the LANGUAGE rather than to a spike.
# It exists because E0 measured that Koka does not provide effect-independent
# exhaustiveness, nominal runtime identity, or a generic Result<T, E>.

[dependencies]
pw-syntax = { path = "../pw-syntax" }
annotate-snippets.workspace = true
serde.workspace = true
serde_json.workspace = true

# E10-A — core Wasm encoding. `wasm-encoder` is the encoder half of the
# `wasm-tools` pair whose parser half (`wit-parser`, `wasmparser`) this crate
# already trusts to check its output, so the two sides of every E10 gate come
# from one upstream.
#
# Verified against crates.io on 2026-08-19: 0.257.1 is the newest published
# version of `wasm-encoder`, `wasmparser` and `wit-parser` alike. `wit-parser`
# moves to it here so the three cannot drift — they are released in lockstep and
# a mixed set is a set nobody upstream tests.
wasm-encoder = "0.257.1"

# E8 gate item: "the world's imports are exactly `contract.imports`, and
# `wit-bindgen` accepts it". `wit-parser` is the crate `wasm-tools` and
# `wit-bindgen` are both built on, so the second half is checked by the real
# parser rather than by a reader written here — a second WIT parser in this
# repo would be the shape the project keeps deleting, and a particularly bad
# one: the whole point of emitting WIT is that somebody else's toolchain reads
# it.
#
# A DEV dependency. Generating WIT needs no parser; only proving the output is
# WIT does.
[dev-dependencies]
wit-parser = "0.257.1"

# The validator, for proving the encoder's output is a well-formed module. A
# module this repo declares valid is worth nothing; one the parser `wasmtime`
# is built on accepts is evidence.
wasmparser = "0.257.1"
