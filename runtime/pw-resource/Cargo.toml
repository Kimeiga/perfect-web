[package]
name = "pw-resource"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# E4 — the local resource runtime (charter §14 M4 task 3).
#
# Behaviour, not static guarantees: the compiler-side half of E4 is the resource
# manifest in `pw-core::hir`.

[dependencies]

# The runtime does NOT depend on the compiler. These are dev-only, so the
# manifest correspondence can be tested without either crate importing the
# other — the schema is what they share (ADR-0018).
[dev-dependencies]
pw-core = { path = "../../compiler/pw-core" }
pw-syntax = { path = "../../compiler/pw-syntax" }
