# Temporary, fixed-branch delivery of a locally tested patch. Removes itself.
name: apply-reviewed-resolver
on:
  push:
    branches: [fix/resolved-signatures-2026-09-15]
    paths: [.github/workflows/apply-reviewed-resolver.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - name: Verify base and apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5b10b25d3c6b7afc7054c585c6fb02aec0033d11
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          data = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == '20473aa521861cc30c92a26b8f2b8ad3b7f63da7a046ae1394b55b327f410791', 'reviewed patch digest mismatch'
          pathlib.Path('/tmp/reviewed-resolver.patch').write_bytes(data)
          PY
          git apply --check /tmp/reviewed-resolver.patch
          git apply --index /tmp/reviewed-resolver.patch
          git rm .github/workflows/compiler-review-toolchain.yml .github/workflows/apply-reviewed-resolver.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair recursive type resolution and namespace boundaries' -m 'Locally verified with 913 passing workspace tests, one existing ignored test, focused boundary regressions, and Clippy. Remove temporary review helpers. Full signature migration and call checking remain separate obligations.'
          git push origin HEAD:refs/heads/fix/resolved-signatures-2026-09-15
