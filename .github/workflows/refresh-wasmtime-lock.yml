name: finalize-supply-chain-fix

on:
  push:
    branches: ["fix/licenses-and-wasmtime-audit"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/licenses-and-wasmtime-audit
      - name: Synchronize technology matrix and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/research/technology-matrix.md")
          text = path.read_text()
          text = text.replace("**Wasmtime 47.0.3**", "**Wasmtime 47.0.4**")
          text = text.replace("Wasmtime 47.0.3           Apache-2.0 WITH LLVM-exception", "Wasmtime 47.0.4           Apache-2.0 WITH LLVM-exception")
          text = text.replace(
              "wit-bindgen 0.60.0        Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT\n",
              "wit-bindgen 0.60.0        Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT\n"
              "additional Rust transitive BSD-2-Clause / BSD-3-Clause / Zlib\n",
          )
          text = text.replace(
              "Automated license and vulnerability checking in CI is **not yet implemented** —\n"
              "charter §3.6 requires it and it is recorded as an open item in\n"
              "`docs/KNOWN_LIMITATIONS.md` and `docs/NEXT.md`.\n",
              "Automated Rust license and vulnerability checking runs in CI through `cargo-deny`.\n"
              "The allowlist remains explicit and permissive-only; advisories remain deny-by-default.\n",
          )
          path.write_text(text)
          PY
          git rm .github/workflows/refresh-wasmtime-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/technology-matrix.md
          git commit -m "Document supply-chain audit policy"
          git push
