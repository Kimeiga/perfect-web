name: codex refresh node lockfile

on:
  push:
    branches:
      - codex/hold-requires-at-runtime

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/hold-requires-at-runtime
      - uses: pnpm/action-setup@v4
      - name: Refresh lockfile
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          rm .github/workflows/codex-refresh-node.yml
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refresh patched Node lockfile"
          git push origin HEAD:codex/hold-requires-at-runtime
