# Measure full Rust test coverage under package-level runner sharding.
# No production CI changes; compare package-partitioned tests against cargo --workspace.
name: Cargo test sharding benchmark

on:
  pull_request:
    paths:
      - .github/workflows/cargo-test-shard-speed.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-test-sharding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: ARM64 native tests / ${{ matrix.group }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        group: [full, pw-core, pw-dev-server, rest]
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-D warnings'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install same pinned tools as CI
        run: just bootstrap
      - name: Configure isolated Cargo outputs and check package partition
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/test-shard-target" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          import subprocess
          data = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--format-version", "1", "--no-deps"], text=True,
          ))
          names = {p["name"] for p in data["packages"] if p["id"] in data["workspace_members"]}
          assert {"pw-core", "pw-dev-server"} <= names
          assert len(names - {"pw-core", "pw-dev-server"}) > 0
          print("workspace crates:", len(names))
          print("other packages:", sorted(names - {"pw-core", "pw-dev-server"}))
          PY
      - name: Execute complete native package partition and measure wall time
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p shard-results
          case "$GROUP" in
            full)
              cmd=(cargo test --locked --workspace --no-fail-fast)
              ;;
            pw-core)
              cmd=(cargo test --locked -p pw-core --no-fail-fast)
              ;;
            pw-dev-server)
              cmd=(cargo test --locked -p pw-dev-server --no-fail-fast)
              ;;
            rest)
              cmd=(cargo test --locked --workspace --exclude pw-core --exclude pw-dev-server --no-fail-fast)
              ;;
            *) echo "Unexpected group $GROUP" >&2; exit 2 ;;
          esac
          printf '%q ' "${cmd[@]}" > shard-results/command.txt
          echo >> shard-results/command.txt
          start=$(date +%s)
          if "${cmd[@]}" > shard-results/cargo.log 2>&1; then
            status=0
          else
            status=$?
          fi
          elapsed=$(( $(date +%s) - start ))
          printf '%s\n' "$elapsed" > shard-results/wall.seconds
          printf '%s\n' "$status" > shard-results/status.txt
          GROUP="$GROUP" ELAPSED="$elapsed" STATUS="$status" python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          data = pathlib.Path("shard-results/cargo.log").read_text(errors="replace")
          results = re.findall(
              r"(?m)^test result: ok\.\s+(\d+) passed;\s+(\d+) failed;\s+(\d+) ignored;",
              data,
          )
          if not results:
              print("No successful libtest results parsed; report failure")
              sys.exit(1)
          count = {
              "group": os.environ["GROUP"],
              "passed": sum(int(x[0]) for x in results),
              "failed": sum(int(x[1]) for x in results),
              "ignored": sum(int(x[2]) for x in results),
              "binaries": len(results),
              "seconds": int(os.environ["ELAPSED"]),
              "exit": int(os.environ["STATUS"]),
          }
          pathlib.Path("shard-results/result.json").write_text(json.dumps(count, indent=2))
          print(json.dumps(count, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### {count['group']}\n\n"
                      f"{count['seconds']} seconds, {count['passed']} passed, "
                      f"{count['ignored']} ignored across {count['binaries']} result blocks; "
                      f"exit {count['exit']}.\n")
          if count["failed"] or count["exit"]:
              sys.exit(1)
          PY
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-shard-${{ matrix.group }}
          path: shard-results/
          if-no-files-found: warn
          retention-days: 7

  parity:
    name: Verify exact test-count coverage and wall-time benefit
    if: always()
    needs: [shard]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rust-test-shard-*
          path: results
      - name: Compare all complete test groups to unsharded control
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("results")
          wanted = ("full", "pw-core", "pw-dev-server", "rest")
          values = {}
          for name in wanted:
              path = root / f"rust-test-shard-{name}" / "result.json"
              if not path.exists():
                  sys.exit(f"Missing result: {path}")
              values[name] = json.loads(path.read_text())
          for name, value in values.items():
              if value["exit"] or value["failed"] or not value["binaries"]:
                  sys.exit(f"Missing/broken Rust tests in {name}: {value}")
          for field in ("passed", "failed", "ignored", "binaries"):
              want = values["full"][field]
              got = sum(values[n][field] for n in wanted if n != "full")
              if want != got:
                  sys.exit(f"{field} parity failure: full={want}, shards={got}")
          full = values["full"]["seconds"]
          shards = max(values[n]["seconds"] for n in wanted if n != "full")
          speedup = full / shards
          summary = f"Full {full}s vs parallel shards {shards}s, speedup {speedup:.2f}x"
          print(summary)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## ARM64 complete workspace test partition\n\n{summary}\n\n"
                      "The comparison includes separate cold build cost per runner "
                      "and full native + doctest coverage.\n")
          PY
