# Temporary read-only review helper, removed before merging.
name: e9-offline-review
on:
  push:
    branches: [fix/e9-resolved-value-types]
    paths: [.github/workflows/e9-offline-review.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.1'
          components: rustfmt,clippy
      - name: Collect pinned source and offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e9"
          cargo vendor --locked "$RUNNER_TEMP/e9/vendor" > "$RUNNER_TEMP/e9/vendor-config.toml"
          git archive --format=tar.gz --prefix=perfect-web/ HEAD > "$RUNNER_TEMP/e9/source.tar.gz"
          toolchain="$(rustc --print sysroot)"
          tar -czf "$RUNNER_TEMP/e9/toolchain.tar.gz" --exclude=share -C "$toolchain" .
          rustc --version --verbose > "$RUNNER_TEMP/e9/versions.txt"
          cargo --version >> "$RUNNER_TEMP/e9/versions.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/e9/source-commit.txt"
          tar -czf "$RUNNER_TEMP/e9/vendor.tar.gz" -C "$RUNNER_TEMP/e9" vendor
          rm -rf "$RUNNER_TEMP/e9/vendor"
          cd "$RUNNER_TEMP/e9"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e9-offline-review
          path: ${{ runner.temp }}/e9/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
