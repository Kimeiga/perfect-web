name: bun vs pnpm experiment

on:
  pull_request:
    paths:
      - .github/workflows/bun-pnpm-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-comparison:
    name: install comparison (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Record versions
        run: |
          node --version
          pnpm --version
          bun --version
      - name: Compare reproducible installs (scripts disabled)
        shell: bash
        run: |
          set -euo pipefail
          echo "| Manager | Cache | Trial | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          for manager in pnpm bun; do
            rm -rf node_modules
            if [ "$manager" = pnpm ]; then
              rm -rf "$RUNNER_TEMP/pnpm-benchmark-store"
            else
              rm -rf "$RUNNER_TEMP/bun-benchmark-cache"
            fi
            for trial in 1 2 3; do
              rm -rf node_modules
              start=$(date +%s%N)
              if [ "$manager" = pnpm ]; then
                pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/pnpm-benchmark-store"
              else
                BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/bun-benchmark-cache" bun install --frozen-lockfile --ignore-scripts
              fi
              finish=$(date +%s%N)
              elapsed=$(awk -v a="$start" -v b="$finish" 'BEGIN {printf "%.3f", (b-a)/1000000000}')
              if [ "$trial" = 1 ]; then cache=cold; else cache=warm; fi
              echo "| $manager | $cache | $trial | $elapsed |" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Installation scripts disabled equally for both managers; excludes Cypress binary download." >> "$GITHUB_STEP_SUMMARY"
          echo "Bun migrates pnpm-lock.yaml in memory under --frozen-lockfile; original lockfile is unchanged." >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml

  runtime-compatibility:
    name: JS build and runtime (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          if [ "${{ matrix.runtime }}" = bun ]; then bun install --frozen-lockfile --ignore-scripts; else pnpm install --frozen-lockfile --ignore-scripts; fi
      - name: Root runtime test
        run: |
          if [ "${{ matrix.runtime }}" = bun ]; then bun test spikes/layout-phase-scheduler/test/loaf.test.mjs; else node --test spikes/layout-phase-scheduler/test/loaf.test.mjs; fi
      - name: SvelteKit typecheck and production build
        working-directory: benchmarks/baselines/sveltekit
        run: |
          if [ "${{ matrix.runtime }}" = bun ]; then bun run --bun typecheck && bun run --bun build; else pnpm typecheck && pnpm build; fi
      - name: Next.js typecheck and production build
        working-directory: benchmarks/baselines/next-react
        run: |
          if [ "${{ matrix.runtime }}" = bun ]; then bun run --bun typecheck && bun run --bun build; else pnpm typecheck && pnpm build; fi

  marko-browser-tooling:
    name: Marko and browser tooling (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependencies without lifecycle scripts
        run: |
          if [ "${{ matrix.runtime }}" = bun ]; then bun install --frozen-lockfile --ignore-scripts; else pnpm install --frozen-lockfile --ignore-scripts; fi
      - name: Marko production build
        working-directory: spikes/marko-stream-resume
        run: |
          if [ "${{ matrix.runtime }}" = bun ]; then bun run --bun build; else pnpm build; fi
      - name: Marko server smoke (HTTP static and streaming routes)
        working-directory: spikes/marko-stream-resume
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.runtime }}" = bun ]; then PORT=4321 bun dist/index.mjs > /tmp/marko-server.log 2>&1 & else PORT=4321 node dist/index.mjs > /tmp/marko-server.log 2>&1 & fi
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4321/static -o /tmp/marko-static.html; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/marko-server.log; exit 1; fi
            sleep 0.25
          done
          test -s /tmp/marko-static.html
          curl -fsS --max-time 10 http://127.0.0.1:4321/stream -o /tmp/marko-stream.html
          test -s /tmp/marko-stream.html
      - name: Cypress CLI discovery
        working-directory: spikes/todomvc-cypress
        run: |
          if [ "${{ matrix.runtime }}" = bun ]; then bunx --bun cypress --version; else pnpm exec cypress --version; fi
      - name: Playwright CLI discovery (Bun incompatibility currently expected)
        working-directory: spikes/pw-to-marko
        run: |
          if [ "${{ matrix.runtime }}" = bun ]; then bunx --bun playwright test --list; else pnpm exec playwright test --list; fi
