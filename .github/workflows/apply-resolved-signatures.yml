# Temporary fixed-branch delivery of the already reviewed resolved-signature tree.
name: apply-resolved-signatures
on:
  push:
    branches: [fix/resolved-signatures-2026-09-15]
    paths: [.github/workflows/apply-resolved-signatures.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
      - name: Verify source and apply exact reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=972763024620fac653e7ccb963af720a82eec576
          target_commit=3ea2d8218f395a2a10ba61749d356ea22cc66d37
          target_tree=06bba6054cba2b170e25e1063065d6aab4a917c1

          test "$(git rev-parse HEAD^)" = "$expected_parent"
          git diff --exit-code "$expected_parent" HEAD -- . ':(exclude).github/workflows/apply-resolved-signatures.yml'

          git fetch --no-tags origin refs/heads/fix/signature-authority-2026-09-16
          test "$(git rev-parse FETCH_HEAD)" = "$target_commit"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$target_tree"

          git read-tree --reset -u FETCH_HEAD
          test "$(git write-tree)" = "$target_tree"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply verified resolved-signature authority migration' -m 'Replace the truncated temporary payload with the exact reviewed tree from PR #6. The transfer is pinned to the expected source commit, target commit, and target tree; permanent CI and verification gates remain unchanged.'
          test "$(git rev-parse HEAD^{tree})" = "$target_tree"
          git push origin HEAD:refs/heads/fix/resolved-signatures-2026-09-15
