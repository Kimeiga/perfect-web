# One-use transfer of the locally tested diff; removed in the resulting commit.
name: apply-resolver-repair
on:
  push:
    branches: [fix/resolved-signatures-2026-09-15]
    paths: [.github/workflows/apply-resolver-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Kimeiga/perfect-web' && github.ref == 'refs/heads/fix/resolved-signatures-2026-09-15'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Apply and verify exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5b10b25d3c6b7afc7054c585c6fb02aec0033d11
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path
          encoded = ''.join(Path(f'.github/continuation/part{i}.b64').read_text() for i in range(1, 5))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = '06e0abb56bc35257e03b3dd47a54cecc366a55654c486a970d1f9a7bee075696'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch digest mismatch')
          Path(os.environ['RUNNER_TEMP'], 'resolver-repair.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/resolver-repair.patch"
          git apply --index "$RUNNER_TEMP/resolver-repair.patch"
          git rm .github/workflows/apply-resolver-repair.yml .github/continuation/part1.b64 .github/continuation/part2.b64 .github/continuation/part3.b64 .github/continuation/part4.b64
          git diff --cached --check
          test "$(git write-tree)" = 68cdbc3876f57f939a0acc6f96762973a46043ed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve recursive type annotations and reject invalid resolved types' -m 'Keep nested written types in one HIR tree, resolve children recursively, enforce builtin arity and type namespaces, recognize unit syntax, and preserve full manifest types. Add eleven source-driven regression tests. Local verification: 577 compiler tests, strict core Clippy, formatting and actual accepted/store corpus checks. Full PR CI must pass separately. Signature cutover, ordinary call/return compatibility and E10-I remain open. All temporary transfer and toolchain helpers are removed from this tree.'
          git push origin HEAD:refs/heads/fix/resolved-signatures-2026-09-15
          git rev-parse HEAD HEAD^{tree}
