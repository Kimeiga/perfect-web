# Temporary read-only snapshot helper; removed before this branch can merge.
name: semantic-source-snapshot
on:
  push:
    branches: [fix/semantic-signature-cutover-2026-09-16]
    paths: [.github/workflows/semantic-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=perfect-web/ HEAD > "$RUNNER_TEMP/semantic-source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/semantic-source-identity.txt"
          sha256sum "$RUNNER_TEMP/semantic-source.tar.gz" > "$RUNNER_TEMP/semantic-source.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-source-snapshot
          path: |
            ${{ runner.temp }}/semantic-source.tar.gz
            ${{ runner.temp }}/semantic-source-identity.txt
            ${{ runner.temp }}/semantic-source.sha256
          retention-days: 1
          if-no-files-found: error
