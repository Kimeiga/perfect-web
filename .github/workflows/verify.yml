# Heavy verification, off the laptop (ADR-0245).
#
# Evidence recipes — the tests, the mutation controls, the browser specs each
# one runs — sharded across parallel jobs, and the whole browser suite in
# each engine. A push runs the recipes its commits touch (the chain's
# choice, `scripts/ci_plan.py --changed`); the nightly run, every one. A
# recipe's output is an artifact; `just evidence-fetch <run>` copies a run's
# evidence into docs/evidence/, each file naming the run that produced it.
#
# Linux, where the laptop is macOS: charter §13.5 asks for Linux CI, and a
# recipe that only passes on one of them is a finding. Measurements of the
# machine (`scripts/ci_plan.py`'s LOCAL_ONLY) stay on the development machine.
name: verify

on:
  push:
    # A track's branch too (ADR-0253, docs/PARALLEL.md), for what it changed.
    branches: [master, "track/**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      recipes:
        description: "Recipes to run, space-separated; empty runs every one"
        required: false
        default: ""
      shards:
        description: "Shards"
        required: false
        default: "16"

# No concurrency group: a run's plan is its own push's commits, so a later
# run does not cover an earlier one, and none is cancelled for it.

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # Debug info is most of a debug build's size, and nothing here debugs.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      database: ${{ steps.plan.outputs.database }}
      database_browsers: ${{ steps.plan.outputs.database_browsers }}
      database_build: ${{ steps.plan.outputs.database_build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          RECIPES: ${{ inputs.recipes }}
          SHARDS: ${{ inputs.shards || '16' }}
        run: |
          case "$EVENT" in
            push)
              # A track's push (ADR-0253): what the track changed since it left
              # `master`, at every push, in at most 8 shards, so that `master`'s
              # runs keep most of the plan's 20 jobs.
              if [ "${GITHUB_REF_NAME#track/}" != "$GITHUB_REF_NAME" ]; then
                base=$(git merge-base origin/master "$GITHUB_SHA")
                python3 scripts/ci_plan.py --shards 8 --changed "$base" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              # The chain's choice; a first push, with no commit before it, is
              # planned whole.
              elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                python3 scripts/ci_plan.py --shards 16 --changed "$BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              else
                python3 scripts/ci_plan.py --shards 16 --all >> "$GITHUB_OUTPUT"
              fi ;;
            schedule)
              # 16 shards, with the plan, the database job and three browser
              # jobs: the Free plan's 20 at once (ADR-0249).
              python3 scripts/ci_plan.py --shards 16 --all >> "$GITHUB_OUTPUT" ;;
            *)
              if [ -n "$RECIPES" ]; then
                python3 scripts/ci_plan.py --shards "$SHARDS" $RECIPES >> "$GITHUB_OUTPUT"
              else
                python3 scripts/ci_plan.py --shards "$SHARDS" --all >> "$GITHUB_OUTPUT"
              fi ;;
          esac

  recipes:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    name: recipes ${{ matrix.shard.index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # A runner's disk is about 14 GB free. What it ships and nothing here
      # uses goes, some 25 GB: .NET, Android, GHC and CodeQL. In the
      # background, while the toolchain is set up (ADR-0249); a build waits
      # for it.
      - name: Free disk space
        run: |
          nohup bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch /tmp/disk-freed' > /dev/null 2>&1 &
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          # One shard saves the cache, so sixteen do not race to write it.
          save-if: ${{ matrix.shard.index == 0 }}
      - uses: extractions/setup-just@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Koka and the Wasmtime CLI, each verified against its pinned SHA-256,
      # and the Node workspace.
      - name: Bootstrap pinned toolchain
        run: just bootstrap
      # Only a shard with a recipe that drives a browser installs them, and
      # only one with a recipe that reads the build builds (ADR-0249).
      - name: Browsers
        if: matrix.shard.browsers
        working-directory: spikes/own-renderer
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build
        if: matrix.shard.build
        run: |
          for _ in $(seq 150); do [ -e /tmp/disk-freed ] && break; sleep 2; done; df -h /
          cargo build --workspace --locked
          BUILD_ONLY=1 bash spikes/own-renderer/run.sh
          bash spikes/own-renderer/keyed-store.sh
          bash spikes/own-renderer/feed.sh
      - name: Recipes
        env:
          RECIPES: ${{ join(matrix.shard.recipes, ' ') }}
        run: |
          for _ in $(seq 150); do [ -e /tmp/disk-freed ] && break; sleep 2; done
          echo "$(lsb_release -ds) on GitHub Actions, $(uname -m)" > ci-out-runner.txt
          python3 scripts/ci_recipes.py --out ci-out $RECIPES
          mv ci-out-runner.txt ci-out/runner.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.shard.index }}
          path: ci-out/
          retention-days: 90
      # A browser test that failed in a recipe keeps its trace, and what its
      # page's runtime and the network said beside it (feed.spec.mjs's
      # record): the evidence keeps the failure's name alone. Each run of a
      # suite clears the directory, so this is the last run's.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traces-${{ matrix.shard.index }}
          path: spikes/own-renderer/test-results/
          if-no-files-found: ignore
          retention-days: 30

  # The recipes run against a database (ADR-0246): PostgreSQL as the
  # verified image runs it, a throwaway database each run.
  database:
    needs: plan
    if: needs.plan.outputs.database != '[]'
    name: recipes on PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: pw_feed_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PW_FEED_DATABASE_URL: postgresql://postgres:pw@localhost:5432/pw_feed_test
    steps:
      # A runner's disk is about 14 GB free. What it ships and nothing here
      # uses goes, some 25 GB: .NET, Android, GHC and CodeQL. In the
      # background, while the toolchain is set up (ADR-0249); a build waits
      # for it.
      - name: Free disk space
        run: |
          nohup bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch /tmp/disk-freed' > /dev/null 2>&1 &
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: false
      - uses: extractions/setup-just@v2
      # What a shard sets up for its recipes, set up here for these
      # (ADR-0249): the Node workspace, the browsers for a recipe that
      # drives one, and the pages and servers for one that reads them.
      - uses: pnpm/action-setup@v4
        if: needs.plan.outputs.database_build == 'true'
      - uses: actions/setup-node@v5
        if: needs.plan.outputs.database_build == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Bootstrap pinned toolchain
        if: needs.plan.outputs.database_build == 'true'
        run: just bootstrap
      - name: Browsers
        if: needs.plan.outputs.database_browsers == 'true'
        working-directory: spikes/own-renderer
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build
        run: |
          for _ in $(seq 150); do [ -e /tmp/disk-freed ] && break; sleep 2; done
          cargo build --workspace --locked
          if [ "${{ needs.plan.outputs.database_build }}" = "true" ]; then
            BUILD_ONLY=1 bash spikes/own-renderer/run.sh
            bash spikes/own-renderer/keyed-store.sh
            bash spikes/own-renderer/feed.sh
          fi
      - name: Recipes
        env:
          RECIPES: ${{ join(fromJSON(needs.plan.outputs.database), ' ') }}
        run: |
          echo "$(lsb_release -ds) on GitHub Actions, $(uname -m), PostgreSQL 18.6" > ci-out-runner.txt
          python3 scripts/ci_recipes.py --out ci-out $RECIPES
          mv ci-out-runner.txt ci-out/runner.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-database
          path: ci-out/
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: traces-database
          path: spikes/own-renderer/test-results/
          if-no-files-found: ignore
          retention-days: 30

  browser:
    name: browser ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      # A runner's disk is about 14 GB free. What it ships and nothing here
      # uses goes, some 25 GB: .NET, Android, GHC and CodeQL. In the
      # background, while the toolchain is set up (ADR-0249); a build waits
      # for it.
      - name: Free disk space
        run: |
          nohup bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch /tmp/disk-freed' > /dev/null 2>&1 &
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: false
      - uses: extractions/setup-just@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: just bootstrap
      - working-directory: spikes/own-renderer
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - name: Build
        run: |
          for _ in $(seq 150); do [ -e /tmp/disk-freed ] && break; sleep 2; done
          cargo build --locked -p pw-cli -p pw-dev-server -p kiokun-server
          BUILD_ONLY=1 bash spikes/own-renderer/run.sh
          bash spikes/own-renderer/keyed-store.sh
          bash spikes/own-renderer/feed.sh
      - name: Suite
        working-directory: spikes/own-renderer
        run: pnpm exec playwright test --project=${{ matrix.engine }} --reporter=line
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-${{ matrix.engine }}
          path: spikes/own-renderer/test-results/
          retention-days: 30

  summary:
    needs: [plan, recipes, database]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.shards != '[]' || needs.plan.outputs.database != '[]'
        with:
          pattern: evidence-*
          path: artifacts
      - env:
          SHARDS_JSON: ${{ needs.plan.outputs.shards }}
          DATABASE_JSON: ${{ needs.plan.outputs.database }}
        run: |
          expected=$(python3 -c 'import json,os; print(len(json.loads(os.environ["SHARDS_JSON"])) + (1 if json.loads(os.environ["DATABASE_JSON"]) else 0))')
          python3 scripts/ci_summary.py artifacts --shards "$expected"
