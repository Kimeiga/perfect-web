name: Reality Compiler

on:
  pull_request:
    paths:
      - "spikes/reality-compiler/**"
      - ".github/workflows/reality-compiler.yml"
  push:
    branches: [master]
    paths:
      - "spikes/reality-compiler/**"
      - ".github/workflows/reality-compiler.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/reality-compiler
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Enforce Fallow regression gate
        run: npx -y fallow@3.23.0 audit --root . --base origin/master --gate new-only
      - run: npm run build
      - run: npm run test:smoke
