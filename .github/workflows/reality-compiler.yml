name: Reality Compiler

on:
  pull_request:
    paths:
      - "spikes/reality-compiler/**"
      - ".github/workflows/reality-compiler.yml"
  push:
    branches: [master]
    paths:
      - "spikes/reality-compiler/**"
      - ".github/workflows/reality-compiler.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/reality-compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - run: npm run build
