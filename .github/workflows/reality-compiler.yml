name: Reality Compiler

on:
  pull_request:
    paths:
      - "spikes/reality-compiler/**"
      - ".github/workflows/reality-compiler.yml"
  push:
    branches: [master]
    paths:
      - "spikes/reality-compiler/**"
      - ".github/workflows/reality-compiler.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/reality-compiler
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - name: Report Fallow findings without treating workspace ownership debt as a build failure
        run: |
          set +e
          npx -y fallow@3.23.0 audit --root . --base master --gate all --format json --quiet > /tmp/reality-fallow.json
          status=$?
          cat /tmp/reality-fallow.json
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - run: npm run build
