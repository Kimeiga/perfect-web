name: Reality Compiler

on:
  pull_request:
    paths:
      - "spikes/reality-compiler/**"
      - ".github/workflows/reality-compiler.yml"
  push:
    branches: [master]
    paths:
      - "spikes/reality-compiler/**"
      - ".github/workflows/reality-compiler.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/reality-compiler
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install and generate lockfile
        run: npm install --ignore-scripts
      - name: Commit generated lockfile
        if: github.event_name == 'pull_request'
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock Reality Compiler dependencies"
          git push origin HEAD:${{ github.head_ref }}
      - name: Enforce Fallow regression gate
        run: npx -y fallow@3.23.0 audit --root . --base origin/master --gate new-only
      - run: npm run build
